<style>
/* Layout: a lab workbook — task list on the left; each task has three tabs (Design · Code · Test) beside a live, working copy of the target form. */
:root{
  --paper:#EEF3F2; --panel:#FFFFFF; --ink:#13231F; --muted:#526661; --line:#D3DFDC;
  --accent:#0B7A73; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --hi:#E09A1A; --hi-soft:#FFF1D1; --ok:#18804E; --ok-soft:#DDF3E6; --bad:#BD3A2F; --bad-soft:#FBE2DE;
  --code-bg:#0E1B1A; --code-ink:#DCE8E5; --code-dim:#7E9792;
  --tk:#7FB8FF; --ts:#F2C27B; --tn:#B9E58A; --tt:#6FD8C8; --tc:#7B9590;
  --win:#F0F0F0; --win-ink:#1B1F24; --win-line:#A9B1BA; --win-title:#FFFFFF; --win-field:#FFFFFF;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --f-win:"Segoe UI",Tahoma,Arial,sans-serif;
  --scale:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1514; --panel:#13201E; --ink:#E3EEEB; --muted:#93AAA5; --line:#243633;
  --accent:#3FC2B6; --accent-ink:#06201D; --accent-soft:#143532;
  --hi:#F0B240; --hi-soft:#3A2D10; --ok:#4CC38A; --ok-soft:#123326; --bad:#F0736A; --bad-soft:#3D1A17;
  --code-bg:#08100F;
  --win:#2A2F35; --win-ink:#E8EBEE; --win-line:#4B545E; --win-title:#1F2328; --win-field:#16191D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0C1514; --panel:#13201E; --ink:#E3EEEB; --muted:#93AAA5; --line:#243633;
  --accent:#3FC2B6; --accent-ink:#06201D; --accent-soft:#143532;
  --hi:#F0B240; --hi-soft:#3A2D10; --ok:#4CC38A; --ok-soft:#123326; --bad:#F0736A; --bad-soft:#3D1A17;
  --code-bg:#08100F;
  --win:#2A2F35; --win-ink:#E8EBEE; --win-line:#4B545E; --win-title:#1F2328; --win-field:#16191D; color-scheme:dark;}

html{font-size:calc(16px * var(--scale))}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
p{margin:0;max-width:70ch}
code,.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.overall{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.small{padding:3px 9px;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.wrap{display:grid;grid-template-columns:250px minmax(0,1fr)}
.rail{border-right:1px solid var(--line);background:var(--panel);padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px))}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
.rail a .n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:2px}
.rail a .bar{grid-column:2;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.rail a .bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.rail a:hover{background:var(--accent-soft)}
.rail a[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.rail a[aria-current="true"] .n{color:var(--accent-ink)}
.rail a[aria-current="true"] .bar{background:rgba(255,255,255,.3)}
.stage{padding-block:26px 40px;padding-left:max(16px,clamp(16px,3vw,40px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,3vw,40px));min-width:0}
.sec{display:grid;gap:20px;max-width:1200px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.sec h2{font-size:clamp(1.7rem,3.2vw,2.5rem);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.lead{font-size:1.1rem;color:var(--muted);margin-top:8px}
.brief{border-left:4px solid var(--accent);background:var(--panel);padding:12px 16px;border-radius:0 10px 10px 0;font-size:1.02rem}
.brief b{font-family:var(--f-display)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.grid2>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.split>*{min-width:0}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{font-size:1.08rem;margin-bottom:8px}
.sticky{position:sticky;top:96px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.hi{background:var(--hi-soft);color:var(--ink)}
.msg{font-size:.9rem;padding:8px 12px;border-radius:8px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.bad{background:var(--bad-soft);color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;color:var(--muted);background:var(--paper);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nm{font-family:var(--f-mono);font-weight:600;color:var(--accent);white-space:nowrap}
.hidenames td.nm span{filter:blur(6px);cursor:pointer;user-select:none}
.hidenames td.nm span.shown{filter:none}
.pager{display:flex;justify-content:space-between;gap:10px;max-width:1200px;margin-top:8px;flex-wrap:wrap}
.key{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:.72rem;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.tabs .cnt.full{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.steps li:hover{border-color:var(--line)}
.steps input[type=checkbox]{width:20px;height:20px;margin:3px 0 0;accent-color:var(--ok);cursor:pointer}
.steps li.done .txt{color:var(--muted)}
.steps li.done .txt b{text-decoration:line-through;text-decoration-color:var(--ok)}
.steps .txt small{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.steps .txt b{font-weight:700}

/* code blanks */
.code{background:var(--code-bg);color:var(--code-ink);border-radius:12px;font-family:var(--f-mono);font-size:.88rem;line-height:1.9;overflow-x:auto;padding:12px 0}
.code .ln{display:block;padding:0 16px 0 0;white-space:pre}
.code .ln::before{content:attr(data-n);display:inline-block;width:2.6em;padding-right:1em;text-align:right;color:var(--code-dim);opacity:.6}
.k{color:var(--tk)} .s{color:var(--ts)} .nmb{color:var(--tn)} .t{color:var(--tt)} .c{color:var(--tc);font-style:italic}
.blank{font-family:var(--f-mono);font-size:.88rem;background:#17302D;color:#FFE7B0;border:1px dashed #5F8C86;border-radius:4px;padding:0 4px;height:1.6em;vertical-align:baseline;min-width:3ch}
.blank:focus{outline:none;border:1px solid var(--hi);box-shadow:0 0 0 2px rgba(224,154,26,.35)}
.blank.right{border:1px solid #4CC38A;background:#123326;color:#CFF5E0}
.blank.wrong{border:1px solid #F0736A;background:#3D1A17;color:#FFD8D3}
.fb{font-size:.9rem}

/* live form */
.livehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.winwrap{overflow-x:auto;padding:4px 4px 12px}
.win{position:relative;background:var(--win);color:var(--win-ink);border:1px solid var(--win-line);box-shadow:0 8px 24px rgba(0,0,0,.12);font-family:var(--f-win);font-size:.84rem}
.win .tb{height:30px;background:var(--win-title);border-bottom:1px solid var(--win-line);display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px}
.win .tb .wb{display:flex}
.win .tb .wb span{padding:3px 10px;opacity:.75}
.win .cl{position:relative}
.win .c{position:absolute;font-family:var(--f-win);font-size:.84rem;color:var(--win-ink)}
.win input.c,.win select.c{background:var(--win-field);border:1px solid var(--win-line);border-radius:0;padding:2px 5px;height:24px}
.win input.c:focus,.win select.c:focus{outline:2px solid var(--accent);outline-offset:0;box-shadow:none}
.win button.c{background:var(--win-title);border:1px solid var(--win-line);border-radius:2px;cursor:pointer;padding:0 6px;color:var(--win-ink)}
.win button.c:hover{border-color:var(--accent);background:var(--accent-soft)}
.win button.c:active{transform:translateY(1px)}
.win .lst{background:var(--win-field);border:1px solid var(--win-line);overflow:auto;padding:2px 4px;font-size:.8rem}
.win .lst div{white-space:pre}
.win .lst.mono{font-family:"Courier New",Consolas,monospace;font-size:.78rem}
.win label.c{display:flex;gap:5px;align-items:center;cursor:pointer}
.win.navy{background:#000050;color:#fff}
.win.navy .c.lab{color:#fff}
.win .res{background:#B0C4DE;color:#13202B;border:2px inset #C9D3DE;font-size:1.15rem;padding:0 6px;display:flex;align-items:center}
.closed{display:grid;place-items:center;gap:10px;padding:40px 20px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:10px}
.dlg{position:absolute;inset:30px 0 0 0;display:grid;place-items:center;background:rgba(0,0,0,.18);z-index:3}
.dlg>div{background:var(--win-title);color:var(--win-ink);border:1px solid var(--win-line);box-shadow:0 10px 26px rgba(0,0,0,.3);min-width:230px;max-width:92%;display:grid}
.dlg .dt{padding:6px 10px;border-bottom:1px solid var(--win-line);font-size:.8rem}
.dlg .db{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.dlg .db .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.dlg .ic.i{background:#2B6CD0} .dlg .ic.x{background:#C42B1C}
.dlg .df{padding:8px 12px;display:flex;justify-content:flex-end;gap:6px;background:var(--win)}
.dlg .crash{font-family:var(--f-mono);font-size:.74rem;white-space:pre-wrap;max-width:360px}
.ctlbadge{position:absolute;font-family:var(--f-mono);font-size:.66rem;background:var(--hi);color:#1b1300;padding:0 4px;border-radius:3px;pointer-events:none;transform:translateY(-100%);z-index:2;white-space:nowrap}
.win:not(.showNames) .ctlbadge{display:none}

/* tests */
.tests td:first-child{width:34px}
.tests td .btn{white-space:nowrap}
.win,.win *{font-style:normal}
.tests input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
.tests tr.done td{background:var(--ok-soft)}

/* overview */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--accent)}
.tcard .k2{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tcard b{font-family:var(--f-display);font-size:1.15rem}
.meter{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pct{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.prefix td:first-child{font-family:var(--f-mono);font-weight:700;color:var(--accent)}
.corr{background:var(--hi-soft)}
ul.tight{margin:0;padding-left:1.2em;display:grid;gap:6px}

@media (max-width:1050px){ .split{grid-template-columns:minmax(0,1fr)} .sticky{position:static} }
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));overflow-x:auto}
  .rail ol{display:flex;gap:4px;width:max-content}
  .rail a{white-space:nowrap;padding:6px 10px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .stage{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (max-width:560px){ .brand .tag,.overall{display:none} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KW=new Set("using namespace class static void public private partial return if else for while new int double decimal string char bool true false var this null object".split(" "));
function hl(src){ const re=/(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g; let out="",last=0,m;
  while((m=re.exec(src))){ out+=esc(src.slice(last,m.index));
    if(m[1]) out+=`<span class="c">${esc(m[1])}</span>`; else if(m[2]) out+=`<span class="s">${esc(m[2])}</span>`; else if(m[3]) out+=`<span class="nmb">${m[3]}</span>`;
    else { const w=m[4]; out+=KW.has(w)?`<span class="k">${w}</span>`:(/^[A-Z]/.test(w)?`<span class="t">${w}</span>`:w); } last=re.lastIndex; }
  return out+esc(src.slice(last)); }

/* ---------- saved progress (this browser only) ---------- */
let P={steps:{},tests:{},blanks:{}};
try{ const s=JSON.parse(localStorage.getItem("lab1wb")||"null"); if(s&&s.steps) P=Object.assign(P,s); }catch(e){}
const save=()=>{ try{localStorage.setItem("lab1wb",JSON.stringify(P));}catch(e){} };

/* ================= DATA ================= */
const T={};
T.task1={num:"Task 1",title:"Show Name and Clear",short:"Show Name",proj:"ShowNameApp",
 brief:"Create a form and add two buttons and a label. When the <b>Show Name</b> button is clicked, show your name on the label. When the <b>Clear</b> button is clicked, delete the name.",
 props:[["Form","frmShowName","Show Name","Size about 360 × 200"],["Button","btnShowName","Show Name",""],["Button","btnClear","Clear",""],["Label","lblName","(empty)","AutoSize = False, wide; Font size 14"]],
 steps:[
  ["Create the project","File → New → Project → <b>Windows Forms App (.NET Framework)</b>, C#. Name it <code>ShowNameApp</code>."],
  ["Set up the form","Click the empty form. In Properties set <b>(Name)</b> = <code>frmShowName</code> and <b>Text</b> = <code>Show Name</code>."],
  ["Add the controls","From the Toolbox drag two <b>Buttons</b> and one <b>Label</b> onto the form."],
  ["Name every control","Use the properties table: set <b>(Name)</b> and <b>Text</b> of each control <i>before</i> double-clicking anything."],
  ["Make the label easy to read","Label: AutoSize = False, drag it wider, Font size 14. Delete its Text so it starts empty."],
  ["Code the Show Name button","Double-click <code>btnShowName</code>. Visual Studio creates <code>btnShowName_Click</code>. Fill it in (Code tab)."],
  ["Code the Clear button","Double-click <code>btnClear</code> and write its handler."],
  ["Run and test","Press <b>F5</b> and work through the Test tab."]],
 code:[
  "private void btnShowName_Click(object sender, EventArgs e)","{",
  '    {{lblName.Text}} = "Your Name";   // type your own name here',"}","",
  "private void btnClear_Click(object sender, EventArgs e)","{",
  "    lblName.Text = {{\"\"|string.Empty}};","}"],
 hints:["Which property of lblName changes what the user sees? Write it as control.Property.","An empty string is two double quotes with nothing between them."],
 tests:[["Click <b>Show Name</b>","Your name appears on the label","show"],["Click <b>Clear</b>","The label becomes empty","clear"],["Click <b>Clear</b> twice, then <b>Show Name</b>","No error; the name appears again","again"]]
};

 brief:"Create a small calculator. The user types two numbers; the <b>/ x - +</b> buttons show the answer in Result, <b>Clear</b> empties everything and <b>Exit</b> closes the program. Give every object a suitable name.",
 props:[["Form","frmCalculator","Calculator","FormBorderStyle = FixedDialog (optional)"],["Label","lblNumber1","Number 1",""],["Label","lblNumber2","Number 2",""],["Label","lblResultCaption","Result",""],
  ["TextBox","txtNumber1","",""],["TextBox","txtNumber2","",""],["Label","lblResult","(empty)","AutoSize = False; BorderStyle = Fixed3D; BackColor = LightSteelBlue; Font 14"],
  ["Button","btnDivide","/",""],["Button","btnMultiply","x",""],["Button","btnSubtract","-",""],["Button","btnAdd","+",""],["Button","btnClear","Clear",""],["Button","btnExit","Exit",""]],
 steps:[
  ["Create the project","Windows Forms App (.NET Framework), C#, named <code>CalculatorApp</code>."],
  ["Set up the form","(Name) <code>frmCalculator</code>, Text <code>Calculator</code>."],
  ["Add three caption labels","Number 1, Number 2 and Result, down the left side."],

const TASKS=["task1","calc","reg","bill"];

/* ================= helpers ================= */
const blankCount=k=>T[k].code.join("\n").match(/\{\{/g).length;
function blankAnswers(k){ return [...T[k].code.join("\n").matchAll(/\{\{(.*?)\}\}/g)].map(m=>m[1].split("|")); }
const norm=s=>String(s||"").replace(/\s+/g,"").replace(/;$/,"");
function blanksRight(k){ const a=blankAnswers(k), v=P.blanks[k]||[]; return a.filter((ans,i)=>ans.some(x=>norm(x)===norm(v[i]))).length; }
function prog(k){ const t=T[k]; const s=t.steps.filter((_,i)=>P.steps[k+i]).length, te=t.tests.filter(x=>P.tests[k+x[2]]).length, b=blanksRight(k);
  const tot=t.steps.length+t.tests.length+blankCount(k); return {s,te,b,pct:Math.round((s+te+b)/tot*100)}; }

/* ================= sections ================= */
const SECS=[{id:"start",name:"Start here",n:"00"},{id:"prefixes",name:"Naming prefixes",n:"01"},
  ...TASKS.map((k,i)=>({id:k,name:T[k].num+": "+T[k].short,n:String(i+2).padStart(2,"0"),task:k})),{id:"finish",name:"Hand-in checklist",n:"06"}];
let cur=0, tab={task1:"design",calc:"design",reg:"design",bill:"design"};
function renderNav(){
  $("#nav").innerHTML=SECS.map((s,i)=>`<li><a href="#${s.id}" data-i="${i}" aria-current="${i===cur}"><span class="n">${s.n}</span><span>${esc(s.name)}</span>${s.task?`<span class="bar"><i style="width:${prog(s.task).pct}%"></i></span>`:""}</a></li>`).join("");
  $$("#nav a").forEach(a=>a.onclick=e=>{e.preventDefault();go(+a.dataset.i);});
  const all=TASKS.map(prog); $("#overall").textContent=`Overall ${Math.round(all.reduce((a,p)=>a+p.pct,0)/all.length)}%`;
}
function go(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); render(); try{history.replaceState(null,"","#"+SECS[cur].id);}catch(e){} window.scrollTo({top:0}); }
function pager(){ return `<div class="pager"><button class="btn" id="prev" ${cur===0?"disabled":""}>← ${cur>0?esc(SECS[cur-1].name):"Previous"}</button><span class="muted" style="align-self:center;font-size:.85rem">Progress is saved in this browser</span><button class="btn primary" id="next" ${cur===SECS.length-1?"disabled":""}>${cur<SECS.length-1?esc(SECS[cur+1].name):"Next"} →</button></div>`; }

function render(){
  const s=SECS[cur]; let h="";
  if(s.id==="start") h=startHTML(); else if(s.id==="prefixes") h=prefixHTML(); else if(s.id==="finish") h=finishHTML(); else h=taskHTML(s.task);
  $("#stage").innerHTML=`<section class="sec">${h}</section>`+pager();
  $("#prev").onclick=()=>go(cur-1); $("#next").onclick=()=>go(cur+1);
  if(s.task) wireTask(s.task); else if(s.id==="start") wireStart(); else if(s.id==="finish") wireFinish();
  renderNav();
}

/* ---------- start ---------- */
function startHTML(){
  return `<div><div class="eyebrow">Lab Sheet 1 · Week 1</div><h2>Your first Windows Forms apps</h2>
  <p class="lead">Lab Sheet 1 has one task and three exercises. For each one you get a working copy of the finished form to try, build steps, a properties table, code to complete and tests to run on your own app.</p></div>
  <div class="cards">${TASKS.map((k,i)=>{const p=prog(k);return `<button class="tcard" data-i="${i+2}"><span class="k2">${T[k].num}</span><b>${T[k].title}</b><span class="meter"><i style="width:${p.pct}%"></i></span><span class="pct">${p.pct}% · ${p.s}/${T[k].steps.length} steps · ${p.b}/${blankCount(k)} code · ${p.te}/${T[k].tests.length} tests</span></button>`;}).join("")}</div>
  <div class="grid2">
    <div class="card"><h3>Every project starts the same way</h3><ol class="tight">
      <li>Open <b>Visual Studio 2022</b> → <b>Create a new project</b>.</li>
      <li>Choose <b>Windows Forms App (.NET Framework)</b> with the <b>C#</b> tag.</li>
      <li>Type the project name from the task and choose <b>Create</b>.</li>
      <li>Open the <b>Toolbox</b> (Ctrl+Alt+X) and pin it. Keep <b>Properties</b> (F4) open.</li>
      <li>Add controls, then set <b>(Name)</b> and <b>Text</b> <i>before</i> double-clicking.</li>
      <li>Double-click a button to write its <code>_Click</code> code.</li>
      <li>Press <b>F5</b> to run. Close the form to stop.</li></ol></div>
    <div class="card"><h3>How each page works</h3><ul class="tight">
      <li><b>Design</b>: build steps to tick off and the properties table. Hide the names to try naming them yourself first.</li>
      <li><b>Code</b>: fill the blanks, then press Check. Hints are there if you get stuck.</li>
      <li><b>Test</b>: run each test on <i>your</i> Visual Studio app and tick it when it matches. <b>Try it here</b> shows the expected result on the working form.</li>
      <li>Progress is saved in this browser only.</li></ul>
      <div class="row" style="margin-top:12px"><button class="btn small" id="resetAll">Reset all progress</button><span id="resetMsg" class="muted" style="font-size:.85rem"></span></div></div>
  </div>`;
}
function wireStart(){ $$(".tcard").forEach(c=>c.onclick=()=>go(+c.dataset.i)); let armed=false;
  $("#resetAll").onclick=()=>{ if(!armed){armed=true;$("#resetAll").textContent="Click again to confirm";$("#resetMsg").textContent="This clears every tick and answer.";return;} P={steps:{},tests:{},blanks:{}}; save(); render(); }; }

/* ---------- prefixes ---------- */
function prefixHTML(){
  const rows=[["frm","Form","frmCalculator"],["btn","Button","btnClear"],["lbl","Label","lblResult"],["txt","TextBox","txtFirstName"],["rdo","RadioButton","rdoMale"],["cb / chk","CheckBox","cbEmail"],["cbl","CheckBoxList (web)",""],["lst","ListBox","lstBill"],["cmb","ComboBox (drop-down list)","cmbCourse"],["ddl","DropDownList (web)",""],["pnl","Panel","pnlButtons"],["img","Image / PictureBox","imgLogo"],["imb","ImageButton (web)",""],["hlk","HyperLink (web)",""],["lbtn","LinkButton (web)",""],["fu","FileUpload (web)",""],["hdn","HiddenField (web)",""],["mv","MultiView (web)",""],["dtg","DataGrid","dtgStudents",true],["dtl","DataList (web)",""],["rep","Repeater (web)",""],["rdl","RadioButtonList (web)",""],["phd","Placeholder (web)",""],["tbl","Table (web)",""],["gv","GridView (web)",""],["dtv","DetailsView (web)",""]];
  return `<div><div class="eyebrow">Lab Sheet 1 · Prefixes used with controls</div><h2>Naming prefixes</h2>
  <p class="lead">Give every form and control a <b>(Name)</b> made of a lowercase prefix plus a PascalCase word saying what it is for: <code>btnShowName</code>, <code>txtFirstName</code>. Your code becomes readable: <code>lblResult.Text</code> is obviously a label.</p></div>
  <div class="grid2">
    <div class="tbl-wrap"><table class="prefix"><thead><tr><th>Prefix</th><th>Control</th><th>Example</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r[3]?"corr":""}"><td>${r[0]}</td><td>${r[1]}${r[3]?' <span class="pill hi">corrected</span>':""}</td><td class="mono">${r[2]}</td></tr>`).join("")}</tbody></table></div>
    <div class="stack">
      <div class="card"><h3>Notes on the lab sheet's table</h3><ul class="tight">
        <li>The <b>DataGrid</b> row is printed the wrong way round. The prefix is <code>dtg</code>, the control is DataGrid.</li>
        <li>Rows marked <i>(web)</i> are ASP.NET web controls. You won't find them in the Windows Forms Toolbox. Use <b>ComboBox</b> (<code>cmb</code>) instead of DropDownList and <b>LinkLabel</b> (<code>lnk</code>) instead of HyperLink.</li>
        <li><code>chk</code> for CheckBox is also common. Pick one style and use it everywhere.</li></ul></div>
      <div class="card"><h3>Good and bad names</h3>
        <div class="tbl-wrap"><table><thead><tr><th>Bad</th><th>Why</th><th>Good</th></tr></thead><tbody>
        <tr><td class="mono">button1</td><td>Says nothing about its job</td><td class="mono">btnAdd</td></tr>
        <tr><td class="mono">txt1</td><td>Which box is it?</td><td class="mono">txtUnitPrice</td></tr>
        <tr><td class="mono">BtnClear</td><td>Prefix must be lowercase</td><td class="mono">btnClear</td></tr>
        <tr><td class="mono">lbl Total</td><td>No spaces allowed</td><td class="mono">lblTotal</td></tr>
        <tr><td class="mono">clearButton</td><td>No prefix</td><td class="mono">btnClear</td></tr></tbody></table></div></div>
    </div>

}

/* ---------- task page ---------- */
function taskHTML(k){
  const t=T[k], p=prog(k), bc=blankCount(k);
  const cnt=(a,b)=>`<span class="cnt${a===b?" full":""}">${a}/${b}</span>`;
  return `<div><div class="eyebrow">${t.num} · project ${t.proj}</div><h2>${t.title}</h2></div>
  <div class="brief"><b>Lab sheet:</b> ${t.brief}</div>
  <div class="split">
    <div class="stack">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="design" aria-selected="${tab[k]==="design"}">1 · Design ${cnt(p.s,t.steps.length)}</button>
        <button role="tab" data-tab="code" aria-selected="${tab[k]==="code"}">2 · Code ${cnt(p.b,bc)}</button>
        <button role="tab" data-tab="test" aria-selected="${tab[k]==="test"}">3 · Test ${cnt(p.te,t.tests.length)}</button></div>
      <div id="tabBody"></div>
    </div>
    <div class="stack sticky">
      <div class="livehead"><div><div class="eyebrow">Working copy</div><div class="muted" style="font-size:.88rem">This is how your finished app should behave. Try it.</div></div>
        <div class="row"><label class="row" style="gap:6px;font-size:.85rem"><input type="checkbox" id="showNames"> Show names</label><button class="btn small" id="restartLive">Restart app</button></div></div>
      <div class="winwrap" id="live"></div>
    </div>
  </div>`;
}
function wireTask(k){
  $$(".tabs button").forEach(b=>b.onclick=()=>{tab[k]=b.dataset.tab;render();});
  const body=$("#tabBody"); const t=T[k];
  if(tab[k]==="design"){
    body.innerHTML=`<div class="card"><h3>Build steps</h3><ol class="steps">${t.steps.map((s,i)=>`<li class="${P.steps[k+i]?"done":""}"><input type="checkbox" id="st-${k}-${i}" data-key="${k+i}" ${P.steps[k+i]?"checked":""}><label class="txt" for="st-${k}-${i}"><b>${i+1}. ${s[0]}</b><small>${s[1]}</small></label></li>`).join("")}</ol></div>
      <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Properties table</h3><label class="row" style="gap:6px;font-size:.85rem"><input type="checkbox" id="hideN"> Hide names (try first)</label></div>
      <div class="tbl-wrap" id="propTbl"><table><thead><tr><th>Control</th><th>(Name)</th><th>Text</th><th>Other properties</th></tr></thead><tbody>${t.props.map(r=>`<tr><td>${r[0]}</td><td class="nm"><span>${r[1]}</span></td><td>${esc(r[2])}</td><td class="muted" style="font-size:.85rem">${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted" style="font-size:.85rem;margin-top:8px">Changing the form's (Name) also renames its class; Visual Studio updates <code>Program.cs</code> for you.</p></div>`;
    $$(".steps input").forEach(c=>c.onchange=()=>{ P.steps[c.dataset.key]=c.checked; save(); c.closest("li").classList.toggle("done",c.checked); refreshCounts(k); });
    $("#hideN").onchange=e=>{ $("#propTbl").classList.toggle("hidenames",e.target.checked); };
    $$("#propTbl td.nm span").forEach(s=>s.onclick=()=>s.classList.add("shown"));
  } else if(tab[k]==="code"){
    const ans=blankAnswers(k), vals=P.blanks[k]||[]; let bi=0;
    const lines=t.code.map((L,ln)=>{ let out="",last=0; const re=/\{\{(.*?)\}\}/g; let m;
      while((m=re.exec(L))){ out+=hl(L.slice(last,m.index)); const a=ans[bi]; const w=Math.max(...a.map(x=>x.length))+2;
        out+=`<input class="blank" data-b="${bi}" value="${esc(vals[bi]||"")}" style="width:${w}ch" spellcheck="false" autocomplete="off" aria-label="Blank ${bi+1}">`; bi++; last=re.lastIndex; }
      out+=hl(L.slice(last)); return `<span class="ln" data-n="${ln+1}">${out||" "}</span>`; }).join("");
    body.innerHTML=`<div class="row" style="justify-content:space-between"><p class="muted" style="font-size:.92rem">Fill each <span class="pill hi">blank</span>, then press Check. Type the same code into your Visual Studio project.</p></div>
      <div class="code" id="codeBox">${lines}</div>
      <div class="row"><button class="btn primary" id="chk">Check</button><button class="btn" id="hint">Hint</button><button class="btn" id="reveal">Show answers</button><button class="btn small" id="clr">Clear blanks</button></div>
      <div class="fb" id="fb"></div>
      <div class="card"><h3>Why it works</h3>${explainCode(k)}</div>`;
    const inputs=$$("#codeBox .blank");
    inputs.forEach(inp=>{ inp.addEventListener("input",()=>{ (P.blanks[k]=P.blanks[k]||[])[+inp.dataset.b]=inp.value; save(); inp.classList.remove("right","wrong"); });
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } }); });
    const check=()=>{ let r=0; inputs.forEach(inp=>{ const ok=ans[+inp.dataset.b].some(x=>norm(x)===norm(inp.value)); inp.classList.toggle("right",ok); inp.classList.toggle("wrong",!ok); if(ok) r++; });
      $("#fb").innerHTML= r===inputs.length?`<div class="msg ok">All ${r} blanks correct. Now type it into Visual Studio and run it.</div>`:`<div class="msg bad">${r} of ${inputs.length} correct. Red blanks need another look.</div>`; refreshCounts(k); };
    $("#chk").onclick=check;
    $("#hint").onclick=()=>{ const i=inputs.findIndex(inp=>!ans[+inp.dataset.b].some(x=>norm(x)===norm(inp.value))); if(i<0){$("#fb").innerHTML='<div class="msg ok">Nothing left to hint. Press Check.</div>';return;} inputs[i].focus(); $("#fb").innerHTML=`<div class="msg" style="background:var(--hi-soft)"><b>Blank ${i+1}:</b> ${esc(t.hints[i]||"Look at the surrounding code.")}</div>`; };
    $("#reveal").onclick=()=>{ inputs.forEach(inp=>{ inp.value=ans[+inp.dataset.b][0]; (P.blanks[k]=P.blanks[k]||[])[+inp.dataset.b]=inp.value; }); save(); check(); };
    $("#clr").onclick=()=>{ P.blanks[k]=[]; save(); render(); };
    if((P.blanks[k]||[]).some(v=>v)) check();
  } else {

function refreshCounts(k){ const t=T[k],p=prog(k),vals=[[p.s,t.steps.length],[p.b,blankCount(k)],[p.te,t.tests.length]];

function explainCode(k){
  const E={
    task1:`<ul class="tight"><li><code>lblName.Text</code> is the label's Text property: what the user sees. Assigning to it changes the screen straight away.</li><li><code>""</code> is an empty string, so the label shows nothing.</li><li>The method names <code>btnShowName_Click</code> come from the control names. That's why you rename <i>before</i> double-clicking.</li></ul>`,
    calc:`<ul class="tight"><li><code>TextBox.Text</code> is always a string. <code>"87" + "78"</code> would give <code>"8778"</code>, so convert first with <code>Convert.ToDouble</code>.</li><li><code>(n1 + n2).ToString()</code> turns the number back into text for the label.</li><li>Dividing a double by 0 gives ∞ rather than an error, so we check <code>n2 == 0</code> ourselves and <code>return</code> early.</li><li><code>this.Close()</code> closes the form; because it's the main form, the program ends.</li></ul>`,
    reg:`<ul class="tight"><li><code>condition ? a : b</code> is a short if/else: if rdoMale is checked use "Male", otherwise "Female".</li><li><code>Items.Clear()</code> first, so pressing Register twice doesn't pile up old details.</li><li><code>SelectedIndex = -1</code> means "nothing selected" in a ComboBox or ListBox.</li></ul>`,
    bill:`<ul class="tight"><li><code>total</code> is declared <b>outside</b> the method. A variable inside <code>btnEnter_Click</code> would be reset to 0 on every click.</li><li><code>decimal</code> is exact for money; <code>double</code> can give 0.30000000000000004.</li><li><code>ToString("0.00")</code> always shows two decimal places: 300 becomes 300.00.</li><li><code>PadRight</code>/<code>PadLeft</code> add spaces so the columns line up in a Courier New font.</li></ul>`};
  return E[k];
}
function testNotes(k){

  if(k==="reg") return `<div class="card"><h3>Improve it: no gender selected</h3><p>The short code only checks <code>rdoMale</code>, so "nothing selected" shows Female. A better version:</p><div class="code" style="margin-top:8px">${['string gender = "Not selected";','if (rdoMale.Checked) gender = "Male";','else if (rdoFemale.Checked) gender = "Female";'].map((l,i)=>`<span class="ln" data-n="${i+1}">${hl(l)}</span>`).join("")}</div></div>`;

}
